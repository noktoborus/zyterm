services:
    claude:
        build:
            context: .
            dockerfile: .devcontainer/Dockerfile.claude
        container_name: zyterm-claude
        environment:
            CLAUDE_CONFIG_DIR: /root/.claude
            SHELL: /bin/bash
            GIT_CONFIG_COUNT: 1
            GIT_CONFIG_KEY_0: safe.directory
            GIT_CONFIG_VALUE_0: "*"
            RUST_BACKTRACE: 1
            COLORTERM: truecolor
            PATH: /root/.local/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        user: root
        volumes:
            - claude:/root/.claude
            - .:/workspace/zyterm
        working_dir: /workspace/zyterm
        entrypoint: []
        command: claude

volumes:
  claude:
    external: true
    name: claude-config
