  ru: разрешено
settings.osc_denied:
  en: denied
  ru: запрещено
settings.osc_notification_text:
  en: Notification
  ru: Уведомление
settings.osc_notification_text_hint:
  en: Whether a program may ask the desktop for a notification that carries a text only
  ru: Может ли программа запросить у рабочего стола уведомление, состоящее только из текста
settings.osc_notification_titled:
  en: Notification with a heading
  ru: Уведомление с заголовком
settings.osc_notification_titled_hint:
  en: Whether a program may ask the desktop for a notification that carries a heading and a text
  ru: Может ли программа запросить у рабочего стола уведомление с заголовком и текстом
settings.osc_title:
  en: Window title
  ru: Заголовок окна
settings.osc_title_hint:
  en: Whether a program may rename the window; denied, the window keeps its own name
  ru: Может ли программа переименовать окно; при запрете окно сохраняет своё имя
settings.osc_links:
  en: Links
  ru: Ссылки
settings.osc_links_hint:
  en: Whether a link a program marked is underlined and can be opened; denied, it stays plain text
  ru: Подчёркивается ли и открывается ли ссылка, размеченная программой; при запрете это обычный текст
settings.osc_progress:
  en: Progress
  ru: Ход работы
settings.osc_progress_hint:
  en: A program says how far along it is, and a bar of the status bar shows the share
  ru: Программа сообщает, насколько продвинулась, и доля показывается полосой в строке состояния
settings.osc_marks:
  en: Shell marks
  ru: Метки оболочки
settings.osc_marks_hint:
  en: Whether the marks a shell puts around its prompt and its commands are read, which is what fills the command history
  ru: Читаются ли метки оболочки вокруг приглашения и команд — ими наполняется история команд
settings.context_menu:
  en: Context menu
  ru: Контекстное меню
settings.copy_saved_path:
  en: Copy the path to the clipboard when the selection is saved into a file
  ru: Копирование пути в буфер обмена при сохранении выделенного в файл
settings.osc8_menu:
  en: OSC-8 menu
  ru: Меню OSC-8
settings.osc133_history:
  en: OSC-133 command history
  ru: OSC-133 История команд
settings.command_history:
  en: Commands remembered
  ru: Запоминается команд
settings.command_history_hint:
  en: How many commands the history of one source keeps; each command is kept once
  ru: Сколько команд хранит история одного источника; каждая команда хранится один раз
settings.command_history_enter:
  en: Return
  ru: Return
settings.command_history_shift_enter:
  en: Shift+Return
  ru: Shift+Return
settings.command_history_keys_hint:
  en: The two ways of choosing a command are the two things there are to do with one, so both are always at hand and this says which key is which
  ru: Два способа выбрать команду — это две вещи, которые с ней можно сделать, поэтому обе всегда под рукой, а здесь сказано, какая на какой клавише
settings.history_insert:
  en: Insert
  ru: Вставка
settings.history_insert_hint:
  en: The command is typed into the shell and left standing, to be read once more and changed before it runs
  ru: Команда вводится в оболочку и остаётся стоять — её можно перечитать и поправить перед запуском
settings.history_run:
  en: Run
  ru: Выполнение
settings.history_run_hint:
  en: The command is typed in with the carriage return that runs it
  ru: Команда вводится вместе с возвратом каретки, который её запускает
settings.command_history_empty:
  en: Nothing is remembered and the button that opens the list stays away
  ru: Ничего не запоминается, и кнопка, открывающая список, не показывается
settings.theme_files:
  en: "Themes are read from the %{directory} directory of the configuration, in the color format of Alacritty"
  ru: "Темы читаются из каталога %{directory} в конфигурации, в формате цветов Alacritty"
settings.terminal_theme:
  en: Terminal palette
  ru: Палитра терминала
settings.terminal_theme_hint:
  en: Colors of the terminal in each mode; the interface itself keeps the colors of the toolkit
  ru: Цвета терминала в каждом режиме; сам интерфейс сохраняет цвета библиотеки
settings.themes_reload:
  en: Reads the theme directory again
  ru: Перечитывает каталог тем
themes.broken:
  en: "These theme files could not be read: %{names}"
  ru: "Не удалось прочитать файлы тем: %{names}"
settings.console_restart_hint:
  en: Start the program again when it ends with no error code
  ru: Перезапускать приложение, если приложение вышло без кода ошибки
console.restarting:
  en: "The console ended and is being started again: %{name}"
  ru: "Консоль завершилась и запускается заново: %{name}"
settings.osc_trusted:
  en: Trusted output
  ru: Доверенный вывод
settings.osc_untrusted:
  en: Untrusted output
  ru: Недоверенный вывод
settings.osc_palette:
  en: Palette
  ru: Палитра
settings.osc_palette_hint:
  en: Whether a program may paint the terminal in colors of its own; denied, the palette of the settings stands
  ru: Может ли программа перекрашивать терминал в свои цвета; при запрете действует палитра из настроек
settings.baud_rate:
  en: Baud rate
  ru: Скорость
settings.data_bits:
  en: Data bits
  ru: Биты данных
settings.parity:
  en: Parity
  ru: Чётность
settings.stop_bits:
  en: Stop bits
  ru: Стоп-биты
settings.transfer_profiles:
  en: Transfer profiles
  ru: Профили передачи
settings.general:
  en: General
  ru: Общие
settings.source_none:
  en: Nothing connected
  ru: Ничего не подключено
settings.source_none_hint:
  en: Nothing is connected and no port or console was picked. Pick one beside the title, or connect
  ru: Ничего не подключено и порт или консоль не выбраны. Выберите рядом с заголовком или подключитесь
settings.console_add:
  en: Add a console
  ru: Добавить консоль
settings.variables:
  en: Variables
  ru: Переменные
settings.variables_hint:
  en: One value this connection answers with. A command line of a transfer profile asks for it as {name}
  ru: Одно значение, которым отвечает это подключение. Командная строка профиля передачи запрашивает его как {имя}
settings.variable_name_hint:
  en: "Name a command line asks for with {name}: letters, digits, - and _"
  ru: "Имя, которое командная строка запрашивает как {имя}: буквы, цифры, - и _"
settings.variable_value_hint:
  en: What that name stands for. A transfer refuses to start while it is empty
  ru: Что стоит за этим именем. Пока оно пусто, передача не начнётся
settings.profile_wants:
  en: "It asks this connection for values it has not got: %{names}"
  ru: "Запрашивает у этого подключения значения, которых у него нет: %{names}"
settings.variable_asked_by:
  en: "%{who} asks for this value"
  ru: "Это значение запрашивает: %{who}"
settings.variable_add:
  en: "Add a row for %{name}, asked for by %{who}"
  ru: "Добавить строку для %{name}, её запрашивает %{who}"
settings.profiles_of_source_hint:
  en: Show these transfer profiles on this connection
  ru: Отображать профили передачи в этом подключении
settings.profile_use:
  en: Use this profile with this connection
  ru: Использовать этот профиль с этим подключением
settings.profile_name:
  en: Name
  ru: Имя
settings.profile_pty:
  en: pty
  ru: pty
settings.profile_pty_hint:
  en: "The program talks over the console of the device. A transfer program of the classic kind — the modems, cat, the shell transfer — is the far end of a conversation the device holds on its own console: it reads what the device sends and answers on the same channel. So the console is taken from the terminal and handed to it, the device is given a command of its own first, and one such transfer runs at a time. Switch it off for a program that reaches the device some other way: it is given no input, everything it says goes into a text file of its own, and any number of them run beside each other"
  ru: "Программа общается через консоль устройства. Классическая программа передачи — модемы, cat, передача через оболочку — это дальний конец разговора, который устройство ведёт по своей консоли: она читает то, что шлёт устройство, и отвечает по тому же каналу. Поэтому консоль забирается у терминала и отдаётся ей, устройству сначала подаётся своя команда, и такая передача выполняется только одна. Снимите галку для программы, которая добирается до устройства иначе: ей не подаётся ввод, всё сказанное ею уходит в отдельный текстовый файл, и таких может выполняться сколько угодно параллельно"
settings.send:
  en: Send
  ru: Отправка
settings.receive:
  en: Receive
  ru: Приём
settings.local_command:
  en: On the host
  ru: На хосте
settings.remote_command:
  en: In the terminal
  ru: В терминале
settings.delay:
  en: Delay
  ru: Пауза
settings.command:
  en: Command
  ru: Команда
settings.command_hint:
  en: "Shell command line. What a brace holds says what it is: {>file}, {>files}, {>directory} and {>directories} are what the transfer carries, {:filename}, {:stem} and {:suffix} the parts of its name, and a plain name — letters, digits, - and _ — a value of the connection, set in its settings. The line of this side runs on the host, the line of the device goes into the terminal"
  ru: "Командная строка оболочки. Что стоит в фигурных скобках, то и говорит, чем они являются: {>file}, {>files}, {>directory} и {>directories} — это то, что несёт передача, {:filename}, {:stem} и {:suffix} — части имени файла, а простое имя — буквы, цифры, - и _ — значение подключения, задаваемое в его настройках. Строка этой стороны выполняется на хосте, строка устройства уходит в терминал"
settings.finish_hint:
  en: "Key sent to the device once the line is empty: esc, ctrl+c, ctrl+d, enter, or one of your own, written as ctrl+x, \\x03 or plain text. Empty, nothing is sent"
  ru: "Клавиша, отправляемая на устройство после освобождения линии: esc, ctrl+c, ctrl+d, enter или своя, в виде ctrl+x, \\x03 либо обычный текст. Пусто — ничего не отправляется"
settings.delay_hint:
  en: Milliseconds to wait after the transfer started before this line runs
  ru: Сколько миллисекунд после начала передачи ждать перед запуском этой строки
settings.clone:
  en: Clone
  ru: Клонировать
settings.copy:
  en: copy
  ru: копия
settings.shown_lines:
  en: Lines in the status bar and the statistics
  ru: Линии в статусной строке и статистике
line.brk_note:
  en: The break condition, held from this side until it is let go
  ru: Состояние BREAK, удерживаемое этой стороной, пока его не отпустят
line.hold_note:
  en: Stopping the reading of what the driver of the port has taken
  ru: Прекращение чтения данных из драйвера UART
line.rts_note:
  en: The RTS line (Request To Send), driven from this side
  ru: Переключение линии RTS (Request To Send), которой управляет эта сторона
line.dtr_note:
  en: The DTR line (Data Terminal Ready), driven from this side
  ru: Переключение линии DTR (Data Terminal Ready), которой управляет эта сторона
line.cts_note:
  en: The CTS line (Clear To Send), driven by the device
  ru: Линия CTS (Clear To Send), которой управляет устройство
line.dsr_note:
  en: The DSR line (Data Set Ready), driven by the device
  ru: Линия DSR (Data Set Ready), которой управляет устройство
line.dcd_note:
  en: The DCD line (Data Carrier Detect), driven by the device
  ru: Линия DCD (Data Carrier Detect), которой управляет устройство
line.ri_note:
  en: The RI line (Ring Indicator), driven by the device as a pulse
  ru: Линия RI (Ring Indicator), которой устройство управляет импульсом
settings.line_flags:
  en: The line
  ru: Линия
settings.flush_on_open:
  en: Empty the driver buffers when the port opens
  ru: Сбрасывать буферы драйвера при подключении
settings.flush_on_open_hint:
