settings.theme_light:
  en: Light
  ru: Светлая
settings.font_size:
  en: Terminal size
  ru: Размер терминала
settings.font_size_hint:
  en: Size of the text of the terminal, in points
  ru: Размер текста терминала, в пунктах
settings.font_size_interface:
  en: Interface size
  ru: Размер интерфейса
settings.font_size_interface_hint:
  en: Size of the text of everything but the terminal, in points
  ru: Размер текста всего, кроме терминала, в пунктах
settings.scrollback:
  en: Scrollback memory
  ru: Память истории
settings.scrollback_lines:
  en: "≈ %{lines} lines at this width"
  ru: "≈ %{lines} строк при этой ширине"
settings.scrollback_hint:
  en: "How much memory the lines above the screen may take. At this width it holds about %{lines} lines; a wider window holds fewer, a narrower one more"
  ru: "Сколько памяти могут занять строки выше экрана. При этой ширине помещается около %{lines} строк: в более широком окне меньше, в узком больше"
settings.read_buffer:
  en: Read buffer size
  ru: Размер буфера чтения
settings.read_buffer_hint:
  en: "The buffer a source is read into. It is allocated once, at this size, and never grows: a full one stops the source being read. Nothing is thrown away then — a console waits at its next write, and a port with flow control tells the device to wait, so a window that cannot keep up slows the other side down instead of growing until the memory is gone"
  ru: "Буфер, в который читается источник. Выделяется один раз, этого размера, и не растёт: на заполненном чтение источника останавливается. Ничего при этом не теряется — консоль ждёт на следующей записи, а порт с управлением потоком велит устройству подождать, поэтому окно, которое не успевает, притормаживает ту сторону, а не растёт, пока не кончится память"
settings.read_steps:
  en: Update interval
  ru: Интервал обновления
settings.read_steps_hint:
  en: How long the bytes of a source wait before they are shown, by how fast it is talking. A row holds up to its speed, and a source faster than every row runs at the last one. The longer the wait, the bigger and rarer the pieces a talkative program is shown in. A transfer is never held back
  ru: Сколько байты источника ждут, прежде чем их покажут, — в зависимости от того, как быстро он говорит. Строка действует до своей скорости, а источник быстрее всех строк работает по последней. Чем дольше ожидание, тем реже и более крупными кусками показывается говорливая программа. Передача не сдерживается никогда
settings.read_steps_speed:
  en: up to
  ru: до
settings.read_steps_speed_hint:
  en: The speed this row holds up to. The slowest row the source has not passed is the one in force
  ru: Скорость, до которой действует эта строка. Действует самая медленная строка, которую источник ещё не превысил
settings.read_steps_interval:
  en: wait
  ru: ожидание
settings.read_steps_interval_hint:
  en: How long the bytes wait at this speed. Switched off, they are taken whenever a frame asks
  ru: Сколько байты ждут на этой скорости. При выключенном ожидании их забирают, как только запрошен кадр
settings.read_steps_above:
  en: above
  ru: выше
settings.read_steps_above_hint:
  en: How long the bytes wait past the last row. A source can always be faster than the ladder goes, and a wait that stopped growing there would be a window taking bigger and bigger pieces at the same pace
  ru: Сколько байты ждут выше последней строки. Источник всегда может оказаться быстрее лестницы, а ожидание, переставшее расти, — это окно, забирающее всё более крупные куски с той же частотой
settings.read_steps_linear:
  en: linear slowdown
  ru: линейная прогрессия замедления
settings.read_steps_linear_hint:
  en: The wait grows in step with the speed up to this one, instead of jumping to it at the first byte past the last row. Twice the speed of that row is twice its wait, and the two meet at it, so nothing jumps where the ladder ends
  ru: Ожидание растёт вместе со скоростью до этого значения, а не прыгает к нему на первом байте выше последней строки. Вдвое большая скорость — вдвое большее ожидание, и на самой строке они совпадают, поэтому на конце лестницы ничего не прыгает
settings.read_steps_at_once:
  en: at once
  ru: сразу
settings.read_steps_add:
  en: One more step of the ladder, faster than the ones above it
  ru: Ещё одна ступень лестницы, быстрее предыдущих
settings.read_steps_remove:
  en: Remove this row
  ru: Убрать эту строку
settings.tooltip_delay:
  en: Hint delay
  ru: Задержка подсказок
settings.tooltip_delay_hint:
  en: How long the pointer stands on a control before its hint appears
  ru: Сколько курсор стоит на элементе, прежде чем появится подсказка
settings.debug_window:
  en: Debug window
  ru: Отладочное окно
settings.debug_window_hint:
  en: "A floating window with what the program costs while it runs: the processor, the memory, the threads, the frames, the scrollback and the fonts"
  ru: "Плавающее окно с тем, во что обходится работа программы: процессор, память, потоки, кадры, история строк и шрифты"
settings.selection_anchor:
  en: Selection start mark
  ru: Отметка начала выделения
settings.selection_anchor_hint:
  en: The bar a click leaves in the terminal, where a selection would begin. The place is kept whether the bar is drawn or not, so Shift and a click select from it either way
  ru: Полоска, которую щелчок оставляет в терминале там, где начнётся выделение. Место запоминается независимо от того, рисуется ли она, поэтому Shift со щелчком выделяет от него в любом случае
settings.status_bar:
  en: Show status bar
  ru: Показывать строку состояния
settings.status_bar_height:
  en: Status bar height
  ru: Высота строки состояния
settings.status_bar_height_hint:
  en: Everything in the bar is drawn to match it, so the buttons, the letters and the bar of progress grow with it
  ru: Всё в строке рисуется под неё, поэтому кнопки, надписи и полоса прогресса растут вместе с ней
settings.status_bar_height_unit:
  en: " pt"
  ru: " пт"
settings.font:
  en: Fonts
  ru: Шрифты
settings.font_builtin:
  en: Built-in
  ru: Встроенный
settings.font_terminal:
  en: Terminal
  ru: Терминал
settings.font_terminal_hint:
  en: Fonts the terminal is drawn with, asked in the order they stand in. The first one is the font of the grid; what it does not carry is taken from the ones behind it
  ru: Шрифты, которыми рисуется терминал, в порядке, в котором к ним обращаются. Первый — шрифт сетки; то, чего в нём нет, берётся из стоящих за ним
settings.font_add:
  en: Add
  ru: Добавить
settings.font_up:
  en: Ask this one earlier
  ru: Обращаться к нему раньше
settings.font_down:
  en: Ask this one later
  ru: Обращаться к нему позже
settings.font_interface:
  en: Interface
  ru: Интерфейс
settings.font_interface_hint:
  en: Font the rest of the window is drawn with. Every family the system has is offered, not the monospaced ones alone
  ru: Шрифт, которым рисуется остальное окно. Предлагаются все семейства, которые есть в системе, а не только моноширинные
settings.font_gone:
  en: not installed
  ru: не установлен
