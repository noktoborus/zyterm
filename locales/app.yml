settings.console_directory_hint:
  en: working directory
  ru: рабочий каталог
settings.console_directory_pick:
  en: Choose the directory this console starts in
  ru: Выбрать каталог, в котором запускается консоль
settings.console_program:
  en: program
  ru: программа
settings.clipboard:
  en: Clipboard
  ru: Буфер обмена
settings.clipboard_disabled:
  en: denied
  ru: запрещено
settings.clipboard_copy_paste:
  en: copy and paste
  ru: копирование и вставка
settings.clipboard_copy_only:
  en: copy only
  ru: только копирование
settings.clipboard_copy_limited_paste:
  en: copy and limited paste
  ru: копирование и ограниченная вставка
settings.clipboard_disabled_hint:
  en: OSC-52 is ignored
  ru: Игнорирование команд OSC-52
settings.clipboard_copy_only_hint:
  en: Copy to the clipboard of the desktop; a request to paste is ignored
  ru: Копировать в системный буфер обмена, команда вставки из буфера игнорируется
settings.clipboard_copy_limited_paste_hint:
  en: Copy to the clipboard of the desktop and to the buffer of this window; paste only from that buffer
  ru: Копировать в системный и внутренний буфер обмена, вставка только из внутреннего буфера
settings.clipboard_copy_paste_hint:
  en: Copy to the clipboard of the desktop, and paste from it
  ru: Копировать в системный буфер обмена, вставлять из системного буфера обмена
settings.clipboard_hint:
  en: "What a program may do with the clipboard by itself: nothing; store text; store it and read back what it stored; or use the clipboard of the desktop whole"
  ru: "Что программа может делать с буфером обмена сама: ничего; класть текст; класть и читать положенное ею; либо пользоваться буфером обмена рабочего стола целиком"
settings.osc:
