hold.name:
  en: Reading the port
  ru: Чтение порта
hold.with_flow:
  en: held. The bytes gather in the driver, and the flow control of this line tells the device to wait with them; nothing is lost.
  ru: придержано. Байты копятся в драйвере, а управление потоком этой линии просит устройство подождать; ничего не теряется.
hold.console:
  en: held. The bytes gather in the pipe of the console, and the program waits at its next write; nothing is lost.
  ru: придержано. Байты копятся в канале консоли, а программа ждёт на своей следующей записи; ничего не теряется.
hold.without_flow:
  en: held. This line has no flow control, so the device is told nothing and goes on sending — what the driver cannot hold is lost.
  ru: придержано. На этой линии нет управления потоком, устройству ничего не сообщается и оно продолжает передавать — то, что не помещается в драйвер, теряется.
flow.none:
  en: No flow control
  ru: Без управления
flow.hardware:
  en: RTS/CTS
  ru: RTS/CTS
flow.software:
  en: XON/XOFF
  ru: XON/XOFF
flow.both:
  en: RTS/CTS + XON/XOFF
  ru: RTS/CTS + XON/XOFF


