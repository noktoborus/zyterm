[workspace]
members = ["crates/*", "experiments/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
alacritty_terminal = "0.26"
base64 = "0.23"
crossterm = "0.29"
ratatui = "0.30"
clap = { version = "4.6", features = ["derive"] }
walkdir = "2.5"
dark-light = "3.0"
directories = "6.0"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
egui-file-dialog = { version = "0.15", default-features = false, features = ["serde"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
egui = "0.36"
memmap2 = "0.9"
system-fonts = "0.1"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
md-5 = "0.11"
arboard = { version = "3.6", features = ["wayland-data-control"] }
mime_guess = "2.0"
notify-rust = "4.18"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
open = "5.3"
env_logger = "0.11"
nucleo-matcher = "0.3"
portable-pty = "0.9"
rust-i18n = "4.2"
rustix = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serialport = "4.10"
sha1 = "0.11"
sha2 = "0.11"
shlex = "1.3"
tempfile = "3.27"
thiserror = "2.0"
trash = "5.2"
uuid = { version = "1.26", features = ["v4"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
toml = "1.1"

plate-menu = { path = "crates/plate-menu", version = "1.0.0" }
sh-xfer = { path = "crates/sh-xfer", version = "1.0.0" }
zyt-config = { path = "crates/zyt-config", version = "1.0.0" }
zyt-files = { path = "crates/zyt-files", version = "1.0.0" }
zyt-keymux = { path = "crates/zyt-keymux", version = "1.0.0" }
zyt-pty = { path = "crates/zyt-pty", version = "1.0.0" }
zyt-serial = { path = "crates/zyt-serial", version = "1.0.0" }
zyt-term = { path = "crates/zyt-term", version = "1.0.0" }
zyt-term-egui = { path = "crates/zyt-term-egui", version = "1.0.0" }
zyt-xfer = { path = "crates/zyt-xfer", version = "1.0.0" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[package]
name = "zyterm"
description = "GUI terminal for serial consoles and the local shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dark-light.workspace = true
eframe.workspace = true
egui.workspace = true
memmap2.workspace = true
system-fonts.workspace = true
env_logger.workspace = true
fontdb.workspace = true
log.workspace = true
arboard.workspace = true
egui-file-dialog.workspace = true
image.workspace = true
notify-rust.workspace = true
open.workspace = true
jiff.workspace = true
nucleo-matcher.workspace = true
plate-menu.workspace = true
rust-i18n.workspace = true
serde.workspace = true
shlex.workspace = true
clap.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid.workspace = true
zyt-config.workspace = true
zyt-files.workspace = true
zyt-keymux.workspace = true
zyt-pty.workspace = true
zyt-serial.workspace = true
zyt-term.workspace = true
zyt-term-egui.workspace = true
zyt-xfer.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle.workspace = true
windows.workspace = true

[dev-dependencies]
portable-pty.workspace = true
serde_yaml_ng.workspace = true
